part_fp_list: "./t2v/configs/quant/opensora/remain_fp.txt"
model:
  model_id: "opensora"
  model_type: "opensora"
conditional: true
cfg_split: true
noise_channels: 4
method:
  token_axis: "TQE"
  frame_axis: "MTD_V2"
  diffusion_axis: "NONE"
mtd_v2:
  total_weight: 1.0
  coarse_size: 16
  fine_size: 32
  fine_radius: 2
  coarse_topk: 16
  temporal_offsets: [1, 2, 4]
  temperature: 0.07
  global_temperature: 1.0
  confidence_min: 0.15
  confidence_power: 1.0
  cycle_enabled: true
  cycle_min: 0.05
  cycle_power: 1.0
  snr_full_weight: 1.0
  correspondence_weight: 1.0
  flow_weight: 0.5
  global_relation_weight: 100.0
  fine_scale_weight: 0.5
  flow_huber_beta: 0.05
calib_data:
  path: "your path of calib data"
  n_steps: 50
  batch_size: 4
  n_samples: 10
quant:
  weight:
    optimization:
      joint_weight_act_opt: false
      use_grad: false
      iters: 10000
      checkpoint_interval: 500
      loss:
        lambda_coeff: 0.5
        warmup: 0.0
      params:
        delta:
          lr: 1.e-6
    quantizer:
      n_bits: 4
      per_group: "channel"
      scale_method: "grid_search_lp"
      channel_wise: true
      round_mode: "nearest_ste"
      sym: false
  activation:
    optimization:
      joint_weight_act_opt: false
      use_grad: false
      iters: 100
      loss:
        lambda_coeff: 0.5
        warmup: 0.0
      params: {}
    quantizer:
      n_bits: 6
      per_group: "token"
      dynamic: true
      scale_method: "min_max"
      round_mode: "nearest_ste"
      running_stat: false
      sym: false
      n_spatial_token: 1024
      n_temporal_token: 16
      n_prompt: 120
      smooth_quant:
        enable: false
        channel_wise_scale_type: "momentum_act_max"
        momentum: 0.95
        alpha: 0.11
  grad_checkpoint: false
resume_with_w_quantized:
  path: null
