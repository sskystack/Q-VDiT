part_fp_list: "./t2v/configs/quant/opensora/remain_fp.txt"
model:
  model_id: "opensora"
  model_type: "opensora"
conditional: true
cfg_split: true
noise_channels: 4
method:
  token_axis: "TARQ"
  frame_axis: "BASELINE"
  diffusion_axis: "NONE"
tarq:
  num_groups: 4
  apply_to: ["spatial_attn", "temporal_attn", "cross_attn", "ffn"]
  rank_per_group: 1
  temperature: 0.07
  rank_budget: 1.0
  rank_budget_weight: 1.e-4
calib_data:
  path: "your path of calib data"
  n_steps: 50
  batch_size: 4
  n_samples: 10
  keep_cache_on_cpu: true
  pin_memory: true
  async_prefetch: true
quant:
  weight:
    optimization:
      joint_weight_act_opt: false
      act_quant_in_recon: false
      use_grad: false
      iters: 10000
      checkpoint_interval: 1000
      loss:
        lambda_coeff: 0.5
        warmup: 0.0
      params:
        delta:
          lr: 1.e-6
    quantizer:
      n_bits: 4
      per_group: "channel"
      scale_method: "grid_search_lp"
      channel_wise: true
      round_mode: "nearest_ste"
      sym: false
  activation:
    optimization:
      joint_weight_act_opt: false
      use_grad: false
      iters: 100
      loss:
        lambda_coeff: 0.5
        warmup: 0.0
      params: {}
    quantizer:
      n_bits: 6
      per_group: "token"
      dynamic: true
      scale_method: "min_max"
      round_mode: "nearest_ste"
      running_stat: false
      sym: false
      n_spatial_token: 1024
      n_temporal_token: 16
      n_prompt: 120
      smooth_quant:
        enable: false
        channel_wise_scale_type: "momentum_act_max"
        momentum: 0.95
        alpha: 0.11
  grad_checkpoint: false
resume_with_w_quantized:
  path: null
