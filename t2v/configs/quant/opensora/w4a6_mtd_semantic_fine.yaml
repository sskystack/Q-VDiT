part_fp_list: "./t2v/configs/quant/opensora/remain_fp.txt"
model:
  model_id: "opensora"
  model_type: "opensora"
conditional: true
cfg_split: true
noise_channels: 4
reconstruction_cache_device: "cpu"
method:
  token_axis: "TQE"
  frame_axis: "MTD"
  diffusion_axis: "NONE"
mtd:
  total_weight: 1.0
  transport_size: 16
  temperature: 0.07
  local_transport_weight: 1.0
  motion_residual_weight: 1.0
  global_relation_weight: 0.1
  semantic_importance: true
  semantic_weighting: false
  weight_min: 0.5
  weight_max: 1.5
  semantic_percentile_low: 1.0
  semantic_percentile_high: 99.0
  semantic_pair_batch_size: 2
  attention_chunk_size: 256
  fine_enabled: true
  fine_weight: 0.1
  fine_transport_size: 32
  fine_kernel_size: 5
  fine_selection: "semantic"
  fine_motion_weight: 0.0
  key_region_ratio: 0.25
  key_region_block_size: 4
calib_data:
  path: "your path of calib data"
  n_steps: 50
  batch_size: 4
  n_samples: 10
quant:
  weight:
    optimization:
      joint_weight_act_opt: false
      use_grad: false
      iters: 10000
      checkpoint_interval: 500
      loss:
        lambda_coeff: 0.5
        warmup: 0.0
      params:
        delta:
          lr: 1.e-6
    quantizer:
      n_bits: 4
      per_group: "channel"
      scale_method: "grid_search_lp"
      channel_wise: true
      round_mode: "nearest_ste"
      sym: false
  activation:
    optimization:
      joint_weight_act_opt: false
      use_grad: false
      iters: 100
      loss:
        lambda_coeff: 0.5
        warmup: 0.0
      params: {}
    quantizer:
      n_bits: 6
      per_group: "token"
      dynamic: true
      scale_method: "min_max"
      round_mode: "nearest_ste"
      running_stat: false
      sym: false
      n_spatial_token: 1024
      n_temporal_token: 16
      n_prompt: 120
      smooth_quant:
        enable: false
        channel_wise_scale_type: "momentum_act_max"
        momentum: 0.95
        alpha: 0.11
  grad_checkpoint: false
resume_with_w_quantized:
  path: null
