part_fp_list: "./t2v/configs/quant/opensora/remain_fp.txt"
model:
  model_id: "opensora"
  model_type: "opensora"
conditional: true
cfg_split: true
method:
  token_axis: "TARQ"
  frame_axis: "MTD"
  diffusion_axis: "TAQ"
tarq:
  num_groups: 4
  rank_per_group: 1
  transport_size: 4
  descriptor_dim: 4
  temperature: 0.07
  rank_budget: 1.0
  rank_budget_weight: 1.e-4
mtd:
  transport_size: 4
  temperature: 0.07
  local_transport_weight: 1.0
  motion_residual_weight: 1.0
  global_relation_weight: 0.1
taq:
  num_bins: 1
  trajectory_weight: 1.0
  clip_min: 0.5
  scale_min: 0.5
  scale_max: 2.0
calib_data:
  path: "your path of calib data"
  n_steps: 2
  batch_size: 2
  n_samples: 1
quant:
  weight:
    optimization:
      joint_weight_act_opt: false
      use_grad: false
      iters: 1
      loss:
        lambda_coeff: 0.5
        warmup: 0.0
      params:
        delta:
          lr: 1.e-6
    quantizer:
      n_bits: 4
      per_group: "channel"
      scale_method: "grid_search_lp"
      channel_wise: true
      round_mode: "nearest_ste"
      sym: false
  activation:
    optimization:
      joint_weight_act_opt: false
      use_grad: false
      iters: 1
      loss:
        lambda_coeff: 0.5
        warmup: 0.0
      params: {}
    quantizer:
      n_bits: 6
      per_group: "token"
      dynamic: true
      scale_method: "min_max"
      round_mode: "nearest_ste"
      running_stat: false
      sym: false
      n_spatial_token: 1024
      n_temporal_token: 16
      n_prompt: 120
      smooth_quant:
        enable: false
        channel_wise_scale_type: "momentum_act_max"
        momentum: 0.95
        alpha: 0.11
  grad_checkpoint: false
resume_with_w_quantized:
  path: null
